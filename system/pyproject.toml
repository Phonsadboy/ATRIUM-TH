[project]
name = "atrium-system"
version = "0.4.0"
description = "ATRIUM — headless AI-company core (FastAPI + agents + memory). Serves the UI contract over REST + WebSocket."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
live = [
    "anthropic>=0.69",
]
postgres = [
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
]
graph = [
    "kuzu>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
